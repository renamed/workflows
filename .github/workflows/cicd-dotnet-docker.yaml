name: CICD dotNet Docker

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
      dockerfile-path:
        required: false
        type: string
        default: './Dockerfile'
      build-configuration:
        required: false
        type: string
        default: 'Release'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test -c ${{ inputs.build-configuration }} --no-restore

      - name: Create Git Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.gitversion.outputs.semVer }}" || true
          git push origin "v${{ steps.gitversion.outputs.semVer }}" || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.gitversion.outputs.semVer }}" \
            --title "v${{ steps.gitversion.outputs.semVer }}" \
            --generate-notes

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker Build
        run: |
          docker build \
            -f ${{ inputs.dockerfile-path }} \
            -t "ghcr.io/${{ github.repository }}:${{ steps.gitversion.outputs.semVer }}" \
            -t "ghcr.io/${{ github.repository }}:latest" .

      - name: Docker Push
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ steps.gitversion.outputs.semVer }}"
          docker push "ghcr.io/${{ github.repository }}:latest"